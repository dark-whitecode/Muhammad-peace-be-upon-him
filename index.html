        <p>
            <mark>Muhammad[a] (c. 570 CE – 8 June 632 CE)[b]</mark> was an Arab religious, military, and political leader, and the founder of Islam.[c] According to Islam, he was the final prophet of God who was divinely inspired to preach and confirm the monotheistic teachings of 
            <mark>Adam, 
            Noah, 
            Abraham, 
            Moses, 
            Jesus,</mark>
             and other prophets in Islam.<b> He is believed by Muslims to be the Seal of the Prophets</b>,
              and along with the Quran,
               his teachings and normative examples form the basis for Islamic religious belief.
        <br>
        According to the traditional account,
        <mark>[1][2][3] Muhammad was born in Mecca to the aristocratic Banu Hashim clan of the Quraysh.</mark>
         He was <mark>the son of Abdullah ibn Abd al-Muttalib and Amina bint Wahb.</mark> His father, Abdullah,
          the son of tribal leader Abd al-Muttalib ibn Hashim, died around the time Muhammad was born. <i>His mother Amina died when he was six,</i> leaving Muhammad an orphan.
           He was raised under the care of his grandfather, Abd al-Muttalib,
            and paternal uncle, Abu Talib. In later years, he would periodically seclude himself <mark>in a mountain cave named Hira for several nights of prayer.</mark>
             When he was 40, <mark>in c. 610, Muhammad reported being visited by Gabriel in the cave and receiving his first revelation from God.<> In 613,[4] Muhammad started preaching these revelations publicly,[5] proclaiming that "God is One", that complete "submission" (Islām) to God (Allāh) is the right way of life (dīn),[6] and that he was a prophet and messenger of God, similar to other prophets in Islam.[7]
        <br>
         Muhammad's followers were initially few in number, 
         and experienced persecution by Meccan polytheists for 13 years. 
         To escape ongoing persecution, he sent some of his followers to the Aksumite Empire in 615, before he and his followers migrated from Mecca to Medina (then known as Yathrib) later in 622.

          This event, the Hijrah, marks the beginning of the Islamic calendar, also known as the Hijri calendar. In Medina, Muhammad united the tribes under the Constitution of Medina. In December 629, after eight years of intermittent fighting with Meccan tribes, Muhammad gathered an army of 10,000 Muslim converts and marched on the city of Mecca. 
          The conquest went largely uncontested, and Muhammad seized the city with minimal casualties. <mark>In 632,</mark>
           a few months after returning from the Farewell Pilgrimage, he fell ill and died. By the time of his death, most of the Arabian Peninsula had converted to Islam.
        <br>
        The revelations (waḥy) that Muhammad reported 
        receiving until his death form the verses (āyah) of the Quran, upon which Islam is based, and are regarded by Muslims as the verbatim word of God and his final revelation.
         Besides the Quran, Muhammad's teachings and practices, found in transmitted reports, known as hadith, and in his biography (sīrah), are also upheld and used as sources of Islamic law.
          Apart from Islam, Muhammad plays a significant role in the Druze faith as one of the seven main prophets, and in the Baháʼí Faith as a Manifestation of God</p>
